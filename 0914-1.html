
<!DOCTYPE html> 
<html lang="ko"> 
<head> 
<meta charset="UTF-8"> 
<title>두더지 잡기</title> 
 
<style> 
body { 
    text-align: center; 
    font-family: Arial; 
} 
 
canvas { 
    border: 2px solid black; 
} 
</style> 
 
</head> 
<body> 
 
<h1>두더지 잡기</h1> 
 
<p> 
점수 : 
<span id="score">0</span> | 남은 시간 : <span id="time">30</span>초 
</p> 

<button onclick="startGame()">게임 시작</button> 
 
<canvas id="gameCanvas" 
        width="600" 
        height="400"> 
</canvas> 

<script> 

    const canvas = document.getElementById("gameCanvas"); 
    const ctx = canvas.getContext("2d"); 
    const scoreText = document.getElementById("score"); 
    const timeText = document.getElementById("time"); 
 
 
    let moleX = 300; 
    let moleY = 200; 
    let moleRadius = 30;  
 
    let score = 0; 
 
    let timeLeft = 30; 
    let gameRunning = false; 
    let moleSpeed = 1500; 
    let timerId; 
    let moleMoveId; 
 
 
    function startGame(){ 

        score = 0; 
        timeLeft = 30; 
        gameRunning = true; 
         
        scoreText.textContent = score; 
        timeText.textContent = timeLeft; 
 
        clearInterval(timerId); 
        clearInterval(moleMoveId); 
 
        moveMole(); 
 
        timerId = setInterval(() => { 

            timeLeft--; 
            timeText.textContent = timeLeft; 

            if(timeLeft <= 0){ 
                endGame(); 
            } 

        }, 1000); 

        moleMoveId = setInterval(moveMole, moleSpeed); 
    } 
 
 
    function endGame(){ 

        gameRunning = false; 

        clearInterval(timerId); 
        clearInterval(moleMoveId); 
 
        ctx.clearRect(0, 0, canvas.width, canvas.height); 

        ctx.font = '32px Arial'; 
        ctx.fillStyle = "black"; 
        ctx.textAlign = "center"; 

        ctx.fillText("게임종료!", canvas.width / 2, 180); 
        ctx.fillText("최종점수: " + score, canvas.width / 2, 230); 
    } 
 
 
    function drawMole() 
    { 

        ctx.clearRect(0, 0, canvas.width, canvas.height); 

        // 두더지 머리
        ctx.beginPath(); 
        ctx.arc(moleX, moleY, moleRadius, 0, Math.PI * 2); 
        ctx.fillStyle = "#795548"; 
        ctx.fill(); 
        ctx.strokeStyle = "#4E342E"; 
        ctx.lineWidth = 2; 
        ctx.stroke(); 


        // 왼쪽 귀
        ctx.beginPath(); 
        ctx.arc(moleX - 22, moleY - 20, 10, 0, Math.PI * 2); 
        ctx.fillStyle = "#795548"; 
        ctx.fill(); 
        ctx.stroke(); 


        // 오른쪽 귀
        ctx.beginPath(); 
        ctx.arc(moleX + 22, moleY - 20, 10, 0, Math.PI * 2); 
        ctx.fillStyle = "#795548"; 
        ctx.fill(); 
        ctx.stroke(); 


        // 왼쪽 눈
        ctx.beginPath(); 
        ctx.arc(moleX - 10, moleY - 8, 4, 0, Math.PI * 2); 
        ctx.fillStyle = "black"; 
        ctx.fill(); 


        // 오른쪽 눈
        ctx.beginPath(); 
        ctx.arc(moleX + 10, moleY - 8, 4, 0, Math.PI * 2); 
        ctx.fillStyle = "black"; 
        ctx.fill(); 


        // 코
        ctx.beginPath(); 
        ctx.arc(moleX, moleY + 5, 6, 0, Math.PI * 2); 
        ctx.fillStyle = "#222"; 
        ctx.fill(); 


        // 입
        ctx.beginPath(); 
        ctx.arc(moleX, moleY + 10, 10, 0, Math.PI); 
        ctx.strokeStyle = "black"; 
        ctx.lineWidth = 2; 
        ctx.stroke(); 


        // 왼쪽 수염
        ctx.beginPath(); 
        ctx.moveTo(moleX - 8, moleY + 8); 
        ctx.lineTo(moleX - 28, moleY + 3); 

        ctx.moveTo(moleX - 8, moleY + 13); 
        ctx.lineTo(moleX - 28, moleY + 15); 

        ctx.strokeStyle = "black"; 
        ctx.lineWidth = 1; 
        ctx.stroke(); 


        // 오른쪽 수염
        ctx.beginPath(); 
        ctx.moveTo(moleX + 8, moleY + 8); 
        ctx.lineTo(moleX + 28, moleY + 3); 

        ctx.moveTo(moleX + 8, moleY + 13); 
        ctx.lineTo(moleX + 28, moleY + 15); 

        ctx.strokeStyle = "black"; 
        ctx.lineWidth = 1; 
        ctx.stroke(); 
    } 
 

    function moveMole() { 

        // 게임이 끝났거나 시작되지 않았다면 움직이지 않음
        if(!gameRunning) { 
            return; 
        } 

        moleX = Math.random() * (canvas.width - 80) + 40; 
        moleY = Math.random() * (canvas.height - 80) + 40; 

        drawMole(); 
    } 
 

    // 게임 시작 전에는 두더지를 움직이지 않음
    // 게임이 시작되면 startGame()에서 움직이기 시작함
    // 기존의 setInterval(moveMole,1000)은 제거함
 

    canvas.addEventListener("click", function(event){ 

        // 게임 시작 전이나 게임 종료 후에는 클릭해도 점수가 올라가지 않음
        if(!gameRunning) { 
            return; 
        } 

        const rect = canvas.getBoundingClientRect(); 

        const mouseX = event.clientX - rect.left; 
        const mouseY = event.clientY - rect.top; 
 
        const dx = mouseX - moleX; 
        const dy = mouseY - moleY; 

        const distance = Math.sqrt(dx * dx + dy * dy); 

        if(distance <= moleRadius) { 

            score++; 

            document.getElementById("score").textContent = score; 

            moveMole(); 
        } 
    }); 
 
</script> 
 
</body> 
</html>
