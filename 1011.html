
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>벽돌깨기 게임</title>
<style>
body {
    text-align: center;
    font-family: Arial;
}
canvas {
    border: 2px solid black;
    background: #f9f9f9;
}
</style>
</head>
<body>
<h1>벽돌깨기 게임</h1>
<p>점수: <span id="score">0</span> | 목숨: <span id="lives">3</span></p>
<p>조작: ← / → 방향키</p>
<canvas id="gameCanvas" width="600" height="400"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");
let score = 0;
let lives = 3;
let isGameOver = false;
let isGameClear = false;
let ballSpeed = Math.sqrt(32);
const paddle = {
    x: canvas.width / 2 - 50,
    y: canvas.height - 30,
    width: 100,
    height: 12,
    speed: 7
};
function drawPaddle() {
    ctx.fillStyle = "#333";
    ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
}
const keys = {};
document.addEventListener("keydown", function(event) {
    keys[event.key] = true;
});
document.addEventListener("keyup", function(event) {
    keys[event.key] = false;
});
function movePaddle() {
    if (keys["ArrowLeft"]) paddle.x -= paddle.speed;
    if (keys["ArrowRight"]) paddle.x += paddle.speed;
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.width > canvas.width) {
        paddle.x = canvas.width - paddle.width;
    }
}
const ball = {
    x: canvas.width / 2,
    y: canvas.height - 50,
    radius: 8,
    dx: 4,
    dy: -4
};
function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = "tomato";
    ctx.fill();
    ctx.closePath();
}
function moveBall() {
    if (isGameOver || isGameClear) return;
    ball.x += ball.dx;
    ball.y += ball.dy;
    if (ball.x - ball.radius < 0) {
        ball.x = ball.radius;
        ball.dx = Math.abs(ball.dx);
    }
    if (ball.x + ball.radius > canvas.width) {
        ball.x = canvas.width - ball.radius;
        ball.dx = -Math.abs(ball.dx);
    }
    if (ball.y - ball.radius < 0) {
        ball.y = ball.radius;
        ball.dy = Math.abs(ball.dy);
    }
    if (
        ball.dy > 0 &&
        ball.x + ball.radius > paddle.x &&
        ball.x - ball.radius < paddle.x + paddle.width &&
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius < paddle.y + paddle.height
    ) {
        ball.dy = -Math.abs(ball.dy);
        ball.y = paddle.y - ball.radius;
    }
    if (ball.y - ball.radius > canvas.height) {
        lives--;
        livesText.textContent = lives;
        if (lives <= 0) {
            isGameOver = true;
        } else {
            resetBallAndPaddle();
        }
    }
}
function resetBallAndPaddle() {
    paddle.x = canvas.width / 2 - paddle.width / 2;
    ball.x = canvas.width / 2;
    ball.y = canvas.height - 50;
    ballSpeed = Math.sqrt(32);
    ball.dx = 4;
    ball.dy = -4;
}
const brick = {
    row: 4,
    column: 8,
    width: 60,
    height: 20,
    padding: 10,
    offsetTop: 40,
    offsetLeft: 25
};
const bricks = [];
for (let r = 0; r < brick.row; r++) {
    bricks[r] = [];
    for (let c = 0; c < brick.column; c++) {
        bricks[r][c] = {
            x: 0,
            y: 0,
            visible: true,
            hp: r === 0 ? 2 : 1
        };
    }
}
function drawBricks() {
    for (let r = 0; r < brick.row; r++) {
        for (let c = 0; c < brick.column; c++) {
            const b = bricks[r][c];
            if (b.visible) {
                b.x = c * (brick.width + brick.padding) + brick.offsetLeft;
                b.y = r * (brick.height + brick.padding) + brick.offsetTop;
                ctx.fillStyle = b.hp === 2 ? "#9b59b6" : "#3498db";
                ctx.fillRect(b.x, b.y, brick.width, brick.height);
            }
        }
    }
}
function checkBrickCollision() {
    for (let r = 0; r < brick.row; r++) {
        for (let c = 0; c < brick.column; c++) {
            const b = bricks[r][c];
            if (
                b.visible &&
                ball.x + ball.radius > b.x &&
                ball.x - ball.radius < b.x + brick.width &&
                ball.y + ball.radius > b.y &&
                ball.y - ball.radius < b.y + brick.height
            ) {
                ball.dy *= -1;
                b.hp--;
                if (b.hp <= 0) {
                    b.visible = false;
                    score++;
                    scoreText.textContent = score;
                    ballSpeed = Math.min(ballSpeed + 0.5, 12);
                    const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                    ball.dx = ball.dx / currentSpeed * ballSpeed;
                    ball.dy = ball.dy / currentSpeed * ballSpeed;
                    if (score === brick.row * brick.column) {
                        isGameClear = true;
                    }
                }
                return;
            }
        }
    }
}
function gameOver() {
    alert("게임 오버!");
    document.location.reload();
}
function gameClear() {
    alert("축하합니다! 모든 벽돌을 깼습니다!");
    document.location.reload();
}
function drawGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBricks();
    drawPaddle();
    drawBall();
    if (isGameOver) {
        gameOver();
        return;
    }
    if (isGameClear) {
        gameClear();
        return;
    }
    movePaddle();
    moveBall();
    checkBrickCollision();
    requestAnimationFrame(drawGame);
}
drawGame();
</script>
</body>
</html>
