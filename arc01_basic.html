<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>예제 1: 무지개 과녁</title>
    <style>

    </style>
</head>

<body>

    <canvas id="myCanvas" width="400" height="400"
        style="background: #222;"></canvas>

    <script>

        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        const ball = {
            x: 200,
            y: 200,
        };

        function drawBall() {

            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 120, 0, Math.PI * 2);
            ctx.fillStyle = "red";
            ctx.fill();

            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 90, 0, Math.PI * 2);
            ctx.fillStyle = "orange";
            ctx.fill();

            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 60, 0, Math.PI * 2);
            ctx.fillStyle = "yellow";
            ctx.fill();

            // 초록색
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 40, 0, Math.PI * 2);
            ctx.fillStyle = "green";
            ctx.fill();

            // 파란색
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 20, 0, Math.PI * 2);
            ctx.fillStyle = "blue";
            ctx.fill();
        }

        drawBall();

    </script>

</body>

</html>
