<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>예제 2: 스마일 페이스</title>
</head>
<body>
<canvas id="gameCanvas" width="600" height="400"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

ctx.fillStyle = "#eeeeee";
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.beginPath();
ctx.arc(200, 200, 100, 0, Math.PI * 2);
ctx.fillStyle = "#ffd91a";
ctx.fill();
ctx.strokeStyle = "#f5a900";
ctx.lineWidth = 2;
ctx.stroke();

ctx.beginPath();
ctx.arc(160, 170, 12, 0, Math.PI * 2);
ctx.fillStyle = "black";
ctx.fill();

ctx.beginPath();
ctx.arc(240, 170, 12, 0, Math.PI * 2);
ctx.fill();

ctx.beginPath();
ctx.arc(200, 200, 50, 0, Math.PI);
ctx.strokeStyle = "black";
ctx.lineWidth = 3;
ctx.stroke();
</script>
</body>
</html>
